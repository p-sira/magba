[workspace.package]
version = "0.8.0"
authors = ["Sira Pornsiriprasert <code@psira.me>"]
documentation = "https://docs.rs/magba"
homepage = "https://github.com/p-sira/magba"
repository = "https://github.com/p-sira/magba"
license = "BSD-3-Clause"
keywords = [
    "analytical",
    "magnetism",
    "magnetic-field",
    "simulation",
    "physics",
]
categories = ["science", "simulation", "no-std"]

[package]
name = "magba"
version.workspace = true
authors.workspace = true
categories.workspace = true
keywords.workspace = true
homepage.workspace = true
repository.workspace = true
documentation.workspace = true
license.workspace = true

edition = "2024"
rust-version = "1.88"
readme = "README.md"
description = "Magnetic computation library for Rust"
include = ["/src", "/LICENSE", "/CHANGELOG.md"]

[[bench]]
harness = false
name = "bench"

[[bench]]
harness = false
name = "threshold"
required-features = ["unstable", "io-stl"]

[[bench]]
harness = false
name = "collection_threshold"
required-features = ["threshold-calibration", "mesh"]

[[example]]
name = "generate_error_report"
required-features = ["test-utils", "io-stl"]

[[example]]
name = "graphics"
path = "examples/graphics/appearance.rs"
required-features = ["graphics-plotly"]

[[example]]
name = "field_2d"
path = "examples/graphics/fields/2d.rs"
required-features = ["graphics-plotly"]

[[example]]
name = "field_quiver"
path = "examples/graphics/fields/quiver.rs"
required-features = ["graphics-plotly"]

[[example]]
name = "field_3d"
path = "examples/graphics/fields/3d.rs"
required-features = ["graphics-plotly"]

[[example]]
name = "field_cuboid"
path = "examples/graphics/fields/cuboid.rs"
required-features = ["graphics-plotly"]

[[example]]
name = "field_cylinder"
path = "examples/graphics/fields/cylinder.rs"
required-features = ["graphics-plotly"]

[[example]]
name = "field_dipole"
path = "examples/graphics/fields/dipole.rs"
required-features = ["graphics-plotly"]

[[example]]
name = "field_tetrahedron"
path = "examples/graphics/fields/tetrahedron.rs"
required-features = ["graphics-plotly"]

[[example]]
name = "field_triangle"
path = "examples/graphics/fields/triangle.rs"
required-features = ["graphics-plotly"]

[[example]]
name = "field_path_current"
path = "examples/graphics/fields/path_current.rs"
required-features = ["graphics-plotly"]

[[example]]
name = "field_triangle_current"
path = "examples/graphics/fields/triangle_current.rs"
required-features = ["graphics-plotly"]

[[example]]
name = "field_collection"
path = "examples/graphics/fields/collection.rs"
required-features = ["graphics-plotly"]

[[example]]
name = "graphics_showcase"
path = "examples/graphics/showcase.rs"
required-features = ["graphics-plotly"]

[[example]]
name = "magnet_cuboid"
path = "examples/graphics/magnets/cuboid.rs"
required-features = ["graphics-plotly"]

[[example]]
name = "magnet_cylinder"
path = "examples/graphics/magnets/cylinder.rs"
required-features = ["graphics-plotly"]

[[example]]
name = "magnet_dipole"
path = "examples/graphics/magnets/dipole.rs"
required-features = ["graphics-plotly"]

[[example]]
name = "magnet_mesh"
path = "examples/graphics/magnets/mesh.rs"
required-features = ["graphics-plotly", "mesh"]

[[example]]
name = "magnet_sphere"
path = "examples/graphics/magnets/sphere.rs"
required-features = ["graphics-plotly"]

[[example]]
name = "magnet_tetrahedron"
path = "examples/graphics/magnets/tetrahedron.rs"
required-features = ["graphics-plotly"]

[[example]]
name = "magnet_triangle"
path = "examples/graphics/magnets/triangle.rs"
required-features = ["graphics-plotly"]

[dependencies]
concat-idents = "1.1.5"
delegate = "0.13.5"
derive_more = { version = "2.1.1", optional = true, features = ["display"] }
dyn-clone = { version = "1.0.20", optional = true }
ellip = { version = "1.2.2", default-features = false, features = ["unstable"] }
enum_dispatch = "0.3.13"
getset = "0.1.6"
itertools = { version = "0.14.0", default-features = false }
nalgebra = { version = "0.34.2", default-features = false, features = [
    "macros",
] }
num-traits = { version = "0.2.19", default-features = false }
numeric_literals = "0.2.0"
openmesh = { version = "0.3.0", default-features = false, features = [
    "nalgebra",
] }
rayon = { version = "1.10.0", optional = true }
csv = { version = "1.3.1", optional = true }
regex = { version = "1.12.2", optional = true }
stl_io = { version = "0.11", optional = true }
num-lazy = "0.4.1"
plotly = { version = "0.14.1", optional = true, default-features = false, features = ["plotly_embed_js"] }

[dev-dependencies]
approx = "0.5.1"
criterion = { version = "5.0.2", package = "codspeed-criterion-compat" }
csv = "1.3.1"
regex = "1.12.2"
serde_json = "1.0"
tabled = "0.22"
reproducible = "0.4"

[features]
default = ["std", "rayon", "mesh"]
std = [
    "alloc",
    "ellip/std",
    "num-traits/std",
    "nalgebra/std",
    "openmesh/std",
    "dep:derive_more",
    "dep:dyn-clone",
]
alloc = ["nalgebra/alloc"]
rayon = ["std", "dep:rayon", "nalgebra/rayon"]
libm = ["ellip/libm", "num-traits/libm", "nalgebra/libm", "openmesh/libm"]
mesh = ["alloc"]
graphics = ["std"]
graphics-plotly = ["graphics", "dep:plotly"]
io-stl = ["mesh", "std", "openmesh/stl"]
test-utils = ["std", "dep:csv", "dep:regex"]
unstable = []
threshold-calibration = ["rayon"]
# For code coverage testing only
test_force_fail = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
