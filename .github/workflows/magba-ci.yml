name: Magba CI

permissions:
  contents: read

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  MAGBA_REQUIRE_TEST_DATA: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-
      - name: Clippy
        run: cargo clippy --features graphics-plotly -- -D warnings

  test:
    if: github.event_name != 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ matrix.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ matrix.os }}-
      - name: Test representative feature combinations
        run: |
          cargo test --locked
          cargo test --locked --no-default-features --features std,mesh
          cargo test --locked --no-default-features --features std,rayon,mesh,graphics-plotly,io-stl,test-utils,unstable,threshold-calibration

  test-ubuntu-pairwise:
    if: github.event_name != 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      # Each shard compiles independently, so avoid restoring/uploading a
      # multi-gigabyte target directory four times. Cache dependencies only.
      - name: Cache cargo dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-ubuntu-feature-deps-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-ubuntu-feature-deps-
      - name: Install cargo-hack
        uses: taiki-e/install-action@cargo-hack
      # All 43 pairwise combinations are partitioned exactly once across
      # four independent GitHub-hosted runners: 11/11/11/10 invocations.
      - name: Test pairwise feature combinations (shard ${{ matrix.shard }}/4)
        env:
          RUSTFLAGS: -D warnings
        run: cargo hack test --locked --feature-powerset --depth 2 --exclude-features libm,test_force_fail --features std --partition ${{ matrix.shard }}/4

  test-ubuntu-broad:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Cache cargo dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-ubuntu-feature-deps-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-ubuntu-feature-deps-
      - name: Test broad optional-feature configuration
        env:
          RUSTFLAGS: -D warnings
        run: cargo test --locked --no-default-features --features std,rayon,mesh,graphics-plotly,io-stl,test-utils,unstable,threshold-calibration

  full-feature-powerset:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-full-powerset-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-full-powerset-${{ runner.os }}-
      - name: Install cargo-hack
        uses: taiki-e/install-action@cargo-hack
      - name: Test the full feature powerset
        env:
          RUSTFLAGS: -D warnings
        run: cargo hack test --locked --feature-powerset --exclude-features libm,test_force_fail --features std

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install minimum supported Rust
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Check minimum supported Rust
        run: |
          cargo +1.88.0 check --locked --all-features --lib
          cargo +1.88.0 check --locked --no-default-features --features libm --lib

  check-no-std:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install no_std target
        run: rustup target add thumbv7m-none-eabi
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-nostd-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Install cargo-hack
        uses: taiki-e/install-action@cargo-hack
      - name: Check no_std
        run:
          RUSTFLAGS="-D warnings" cargo hack check --target thumbv7m-none-eabi
          --feature-powerset --exclude-features
          default,std,rayon,mesh,io-stl,graphics,graphics-plotly,test-utils,test_force_fail,threshold-calibration
          --features libm

  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-
      - name: Make doc
        run: RUSTFLAGS="-D warnings" cargo +nightly doc --all-features --no-deps

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check formatting
        run: cargo fmt --all -- --check
