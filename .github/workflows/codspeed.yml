name: CodSpeed

on:
  push:
    branches: [ "main" ]
  pull_request:
  # `workflow_dispatch` allows CodSpeed to trigger backtest
  # performance analysis in order to generate initial data.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # for OpenID Connect authentication with CodSpeed

env:
  CARGO_TERM_COLOR: always

jobs:
  codspeed:
    name: Run benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup rust toolchain, cache and cargo-codspeed binary
        uses: moonrepo/setup-rust@v0
        with:
          channel: stable
          cache-target: release
          bins: cargo-codspeed

      # The `rayon` feature is disabled so that the batch field computations run
      # sequentially, keeping the CPU simulation measurements deterministic.
      - name: Build the benchmark target(s)
        run: cargo codspeed build -m simulation --bench bench --no-default-features --features std,mesh

      - name: Run the benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          run: cargo codspeed run --bench bench
