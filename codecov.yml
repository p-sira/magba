coverage:
  precision: 2
  round: down
  range: "80...100"
  status:
    project:
      default:
        target: 99.1%
        threshold: 0%
    patch:
      default:
        target: auto
        threshold: 1%

ignore:
  - "benches/**/*"
  - "examples/**/*"
  - "tests/**/*"
  - "src/**/tests.rs"
  - "src/testing_util.rs"

comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: false
